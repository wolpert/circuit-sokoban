plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Compile to Java 17 bytecode so the Android module's D8 dexer accepts core
// classes (the code uses no Java 18+ features). Desktop JVM 21 runs it fine.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    // libGDX is used by the render/input/screen packages. The model/ and solver/
    // packages deliberately avoid importing it so they stay pure-Java testable.
    api "com.badlogicgames.gdx:gdx:$gdxVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
